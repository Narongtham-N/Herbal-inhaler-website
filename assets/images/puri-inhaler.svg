<svg width="340" height="560" viewBox="0 0 340 560" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
    <linearGradient id="body" x1="40" y1="40" x2="320" y2="520" gradientUnits="userSpaceOnUse">
        <stop stop-color="#8BE9D2"/>
        <stop offset="0.45" stop-color="#61C6FF"/>
        <stop offset="1" stop-color="#2A3C74"/>
    </linearGradient>
    <linearGradient id="cap" x1="60" y1="25" x2="280" y2="120" gradientUnits="userSpaceOnUse">
